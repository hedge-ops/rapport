name = "Gradle"
markers = ["settings.gradle.kts", "settings.gradle"]
primary_program = "./gradlew"
toolchain_install_hint = "Install a JDK and make sure `java` is on PATH. Rapport uses the checked-in `./gradlew` wrapper and never system Gradle."

[[verbs.fix.steps]]
phase = "fix"
message = "Gradle has no standard autofix lifecycle task; leaving project unchanged."

[[verbs.lint.steps]]
phase = "lint"
program = "./gradlew"
args = ["--no-daemon", "check"]

[[verbs.build.steps]]
phase = "build"
program = "./gradlew"
args = ["--no-daemon", "assemble"]

[[verbs.test.steps]]
phase = "test"
program = "./gradlew"
args = ["--no-daemon", "test"]

[[verbs.validate.steps]]
phase = "validate"
program = "./gradlew"
args = ["--no-daemon", "build"]

[[verbs.audit.steps]]
phase = "audit"
program = "./gradlew"
args = ["--no-daemon", "build"]
