name = "Cargo"
markers = ["Cargo.toml"]
primary_program = "cargo"

[[verbs.fix.steps]]
phase = "format"
program = "cargo"
args = ["fmt"]

[[verbs.lint.steps]]
phase = "format"
program = "cargo"
args = ["fmt", "--", "--check"]

[[verbs.lint.steps]]
phase = "lint"
program = "cargo"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]

[[verbs.build.steps]]
phase = "build"
program = "cargo"
args = ["check"]

[[verbs.test.steps]]
phase = "test"
program = "cargo"
args = ["test"]

[[verbs.audit.steps]]
phase = "release build"
program = "cargo"
args = ["build", "--release"]

[[verbs.audit.steps]]
phase = "docs"
program = "cargo"
args = ["doc", "--no-deps"]
