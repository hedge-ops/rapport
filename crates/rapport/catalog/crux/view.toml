version = 1
id = "CRUX_VIEW"
includes = []

[rules.CRUX_VIEW_001]
text = "ViewModels are pure, shell-independent projections of model state. They contain what the shell needs to render and dispatch, not model behavior or shell implementation."

[rules.CRUX_VIEW_001.avoid]
language = "text"
text = "`PersonViewModel { database, save: fn(...) }`"

[rules.CRUX_VIEW_001.prefer]
language = "text"
text = "`PersonViewModel { name, save: Command }`"

[rules.CRUX_VIEW_002]
text = "ViewModels crossing FFI derive `Facet`, `Serialize`, and `Deserialize`. Privacy-bearing fields still follow the Rust privacy rules for diagnostics and formatting."

[rules.CRUX_VIEW_002.avoid]
language = "text"
text = "a debug-derived ViewModel containing a raw token"

[rules.CRUX_VIEW_002.prefer]
language = "text"
text = "an FFI-safe ViewModel exposing only `AccountStatus`"

[rules.CRUX_VIEW_003]
text = "Put localized product copy in ViewModel fields. Shells choose presentation but do not reconstruct shared labels, warnings, action names, or workflow copy."

[rules.CRUX_VIEW_003.avoid]
language = "text"
text = "`Button(\"Save\")` in Swift"

[rules.CRUX_VIEW_003.prefer]
language = "text"
text = "`Button(viewModel.save.text)`"

[rules.CRUX_VIEW_004]
text = "Represent visible user actions as `Command` values carrying localized text or icon, logical action, enabled state, and the exact model event to dispatch."

[rules.CRUX_VIEW_004.avoid]
language = "text"
text = "an editor exposing only `can_save`"

[rules.CRUX_VIEW_004.prefer]
language = "text"
text = "an editor exposing `save: Command`"

[rules.CRUX_VIEW_005]
text = "Treat each ViewModel command as the source of truth for its action affordance. Shells may choose how to render it but must not independently derive its label, enabled state, logical action, or event."

[rules.CRUX_VIEW_005.avoid]
language = "text"
text = "a shell reconstructing save state and event"

[rules.CRUX_VIEW_005.prefer]
language = "text"
text = "`CommandButton(viewModel.save)`"

[rules.CRUX_VIEW_006]
text = "Use dedicated choice ViewModels for selection controls. A choice is not a `Command` unless it is rendered as an action affordance."

[rules.CRUX_VIEW_006.avoid]
language = "text"
text = "daily and weekly represented as commands"

[rules.CRUX_VIEW_006.prefer]
language = "text"
text = "`Vec<FrequencyChoiceViewModel>`"

[rules.CRUX_VIEW_007]
text = "A choice ViewModel carries its localized label, selected state, availability, stable value when needed, and exact model event. Shells must not synthesize these independently."

[rules.CRUX_VIEW_007.avoid]
language = "text"
text = "`Text(frequency.rawValue.capitalized)`"

[rules.CRUX_VIEW_007.prefer]
language = "text"
text = "`Text(choice.label).disabled(!choice.enabled)`"

[rules.CRUX_VIEW_008]
text = "Name a model projection mechanically: replace a `Model` suffix with `ViewModel`; otherwise append `ViewModel`."

[rules.CRUX_VIEW_008.avoid]
language = "text"
text = "`ActiveModel -> ActiveView`"

[rules.CRUX_VIEW_008.prefer]
language = "text"
text = "`ActiveModel -> ActiveViewModel`"

[rules.CRUX_VIEW_009]
text = "When a model has a `FooModelKind` discriminant, name the corresponding view discriminant `FooViewModelKind`. Do not invent a view-side kind unless it mirrors model variants."

[rules.CRUX_VIEW_009.avoid]
language = "text"
text = "`AuthenticatedDisplayState`"

[rules.CRUX_VIEW_009.prefer]
language = "text"
text = "`AuthenticatedViewModelKind`"

[rules.CRUX_VIEW_010]
text = "Flatten or split model layers only when doing so creates a clear shell-facing concept. Name the result for that user-facing concept and document the departure."

[rules.CRUX_VIEW_010.avoid]
language = "text"
text = "flattening merely to reduce type count"

[rules.CRUX_VIEW_010.prefer]
language = "text"
text = "a documented `Stage` projection for shell routing"

[rules.CRUX_VIEW_011]
text = "When the model uses a struct plus `Kind` enum but the view has no shared fields for the wrapper, collapse the projection into a single `*ViewModel` enum."

[rules.CRUX_VIEW_011.avoid]
language = "text"
text = "an empty wrapper around `AuthenticatingActivityViewModelKind`"

[rules.CRUX_VIEW_011.prefer]
language = "text"
text = "one `AuthenticatingActivityViewModel` enum"

[rules.CRUX_VIEW_012]
text = "Name each projection function after the full snake-case ViewModel name, including `_view_model`. Projection functions are pure."

[rules.CRUX_VIEW_012.avoid]
language = "text"
text = "`fn workspace_activity(...)`"

[rules.CRUX_VIEW_012.prefer]
language = "text"
text = "`fn workspace_activity_view_model(...)`"

[rules.CRUX_VIEW_013]
text = "Give each independently rendered ViewModel its own file, named in snake case after the primary type. Small private support types may remain with their owner."

[rules.CRUX_VIEW_013.avoid]
language = "text"
text = "one `workspace.rs` containing every projection"

[rules.CRUX_VIEW_013.prefer]
language = "text"
text = "separate activity, screen, and workflow ViewModel files"

[rules.CRUX_VIEW_014]
text = "Mirror the model module path unless a skipped model layer has no view-side type, behavior, or rendering contract. Restore the layer when the view needs to own something there."

[rules.CRUX_VIEW_014.avoid]
language = "text"
text = "an unrelated `view/everything_active` tree"

[rules.CRUX_VIEW_014.prefer]
language = "text"
text = "a view tree mirroring authenticated/active"

[rules.CRUX_VIEW_015]
text = "Keep single-field enum variants inline. Extract a dedicated ViewModel when a variant has multiple fields, is independently rendered, carries commands, or is reused."

[rules.CRUX_VIEW_015.avoid]
language = "text"
text = "a one-field `StatusMessageViewModel` wrapper"

[rules.CRUX_VIEW_015.prefer]
language = "text"
text = "`Message { message: String }` inline and complex editor factored"

[rules.CRUX_VIEW_016]
text = "An `ActivityViewModel` represents a window. It owns the window-level workspace and routes screens and workflows within that window."

[rules.CRUX_VIEW_016.avoid]
language = "text"
text = "embedding an activity as an arbitrary row"

[rules.CRUX_VIEW_016.prefer]
language = "text"
text = "opening `PeopleActivityView` in a window"

[rules.CRUX_VIEW_017]
text = "A `ScreenViewModel` represents a routed portion of an activity's window. It owns the content, sections, choices, and commands rendered in that portion."

[rules.CRUX_VIEW_017.avoid]
language = "text"
text = "opening every screen as a separate window"

[rules.CRUX_VIEW_017.prefer]
language = "text"
text = "rendering `PersonScreenView` inside its activity"

[rules.CRUX_VIEW_018]
text = "A `WorkflowViewModel` represents a modal interaction within an activity, typically rendered as a sheet, dialog, or popover. It owns the complete start-to-finish interaction."

[rules.CRUX_VIEW_018.avoid]
language = "text"
text = "opening an admit workflow as a window"

[rules.CRUX_VIEW_018.prefer]
language = "text"
text = "presenting `AdmitPersonWorkflowView` as a sheet"

[rules.CRUX_VIEW_019]
text = "`Stage` is the top-level shell display phase. It may flatten internal startup and authentication states only when that flattening is the shell's routing contract."

[rules.CRUX_VIEW_019.avoid]
language = "text"
text = "exposing every internal boot state to the shell"

[rules.CRUX_VIEW_019.prefer]
language = "text"
text = "`Stage::{Loading, Authenticating, Authenticated}`"

[rules.CRUX_VIEW_020]
text = "Every public ViewModel with an independent rendering contract has a paired rendering construct in each supported shell. The shell construct takes that ViewModel as its primary data source."

[rules.CRUX_VIEW_020.avoid]
language = "text"
text = "a shell view owning independent people and enablement state"

[rules.CRUX_VIEW_020.prefer]
language = "text"
text = "`PeopleScreenView { view_model: PeopleScreenViewModel }`"

[rules.CRUX_VIEW_021]
text = "Construct a `Command` in the ViewModel that owns the visible affordance. Move it into a reusable component only when that component owns the action contract."

[rules.CRUX_VIEW_021.avoid]
language = "text"
text = "constructing save commands in the shell"

[rules.CRUX_VIEW_021.prefer]
language = "text"
text = "`EditorViewModel { save: Command }`"

[rules.CRUX_VIEW_022]
text = "Reuse model or domain types in a ViewModel only when they already express the shell-facing contract. Project internal state when exposing it would make the shell interpret model behavior."

[rules.CRUX_VIEW_022.avoid]
language = "text"
text = "`SyncViewModel { state: SyncStateMachine }`"

[rules.CRUX_VIEW_022.prefer]
language = "text"
text = "`SyncViewModel { status, cancel }`"

[rules.CRUX_VIEW_023]
text = "Use `From<&Model>` only for infallible, context-free projection. Use a named projection function when projection needs locale, time, identifiers, domain readers, routing context, or joined state."

[rules.CRUX_VIEW_023.avoid]
language = "text"
text = "a `From` impl reading time and localization globals"

[rules.CRUX_VIEW_023.prefer]
language = "text"
text = "`workspace_view_model(workspace, today, locale)`"

[rules.CRUX_VIEW_024]
text = "Keep application logic as far from shell edges and as close to the model or domain core as appropriate. View projection selects and formats already-owned meaning; it does not recreate business decisions from raw state."

[rules.CRUX_VIEW_024.avoid]
language = "text"
text = "computing admission limits from raw people and plan fields"

[rules.CRUX_VIEW_024.prefer]
language = "text"
text = "`workspace.can_admit_person()`"
