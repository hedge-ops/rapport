[package]
name = "rapport"
description = "repository factory workflow cli"
keywords = ["cli", "workflow", "agent", "developer-tools", "automation"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
version = "0.4.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rapport-command = { path = "../rapport-command", version = "0.1.0" }
rapport-prose = { path = "../rapport-prose", version = "0.1.0" }
rapport-files = { path = "../rapport-files", version = "0.2.0" }
chrono.workspace = true
clap.workspace = true
dprint-plugin-markdown.workspace = true
nonempty.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
claims.workspace = true
indoc = "2.0"
pretty_assertions.workspace = true
rstest.workspace = true

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
