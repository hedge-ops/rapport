[package]
name = "rapport"
description = "Repository architecture and component review CLI"
keywords = ["cli", "architecture", "agent", "developer-tools", "review"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rapport-prose = { path = "../rapport-prose", version = "0.1.0" }
rapport-files = { path = "../rapport-files", version = "0.3.0" }
rapport-git = { path = "../rapport-git", version = "0.1.1" }
clap.workspace = true
derive_more.workspace = true
nonempty.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
claims.workspace = true
indoc = "2.0"
pretty_assertions.workspace = true
rstest.workspace = true

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
