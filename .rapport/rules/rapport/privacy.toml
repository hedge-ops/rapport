version = 1
id = "RAPPORT_PRIVACY"
purpose = "Rapport-specific classification and diagnostic handling for local developer-tool data."
includes = []

[rules.RAPPORT_PRIVACY_001]
text = "Preserve non-sensitive operational evidence."
rationale = "Rapport is a local developer tool, and users need concrete operational evidence to locate failures and reproduce them. Repository paths, branch names, commit IDs, Context and Ruleset IDs, Work and Task metadata, Just targets, and ordinary command details are operational values, not sensitive data merely because they describe local work. Preserve them in diagnostics unless the domain explicitly classifies a particular value as sensitive."

[rules.RAPPORT_PRIVACY_001.avoid]
language = "rust"
text = '''tracing::error!(repository = "[redacted]", revision = "[redacted]", "running validation failed");'''

[rules.RAPPORT_PRIVACY_001.prefer]
language = "rust"
text = '''tracing::error!(%repository, %revision, target = "ci", "running validation failed");'''

[rules.RAPPORT_PRIVACY_002]
text = "Never emit domain-classified secrets in diagnostics."
rationale = "A diagnostic that copies a credential or token creates another place from which it can be used. Redact values the Rapport domain explicitly classifies as sensitive, including credentials, authentication tokens, secret environment values, and encryption material. Keep the non-sensitive operation and destination around the redaction so the failure remains actionable without exposing the secret."

[rules.RAPPORT_PRIVACY_002.avoid]
language = "rust"
text = '''tracing::error!(host = "api.github.com", token = %token.raw(), "authenticating failed");'''

[rules.RAPPORT_PRIVACY_002.prefer]
language = "rust"
text = '''tracing::error!(host = "api.github.com", token = "[redacted]", "authenticating failed");'''

[rules.RAPPORT_PRIVACY_003]
text = "Avoid replacing useful values with generic summaries."
rationale = "Lengths, counts, and blanket redaction can conceal the exact evidence a user requested without protecting anything classified as sensitive. Keep actionable non-sensitive values in Debug output, errors, logs, and command-failure reports. Apply focused redaction only where the domain requires it, so ordinary diagnostics retain enough detail to identify the operation and correct the failure."

[rules.RAPPORT_PRIVACY_003.avoid]
language = "rust"
text = '''tracing::debug!(title_length = title.len(), repository = "[redacted]", revision = "[redacted]", "reviewing component");'''

[rules.RAPPORT_PRIVACY_003.prefer]
language = "rust"
text = '''tracing::debug!(%title, %repository, %revision, "reviewing component");'''
