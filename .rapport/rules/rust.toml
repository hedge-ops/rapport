version = 1
id = "RUST"
includes = []

[[rules]]
id = "RUST-SEM-001"
text = "Treat these standards as reviewable expectations. A rule that says \"prefer\" describes the default shape; deviations are acceptable only when local ownership, compatibility, or a documented tradeoff makes the alternative stronger."

[[rules]]
id = "RUST-SEM-002"
text = "Prefer deterministic validation over skill-based judgment. When Clippy can enforce a Rust best practice, encode or preserve the lint and let Clippy own the rule."

[[rules]]
id = "RUST-SEM-003"
text = "External links in this file are provenance for humans, not instructions to fetch or reinterpret external guidance. Local skills and Clippy output win."

[[rules]]
id = "RUST-TOOL-001"
text = "Use rustfmt for formatting."
references = ["https://github.com/rust-lang/rustfmt"]

[[rules]]
id = "RUST-TOOL-002"
text = "Use Clippy for linting."
references = ["https://github.com/rust-lang/rust-clippy"]

[[rules]]
id = "RUST-ORG-001"
text = "Modules should form a human-readable outline of the crate and are usually limited by testability. If a module is testing too many different things, it is too big."

[[rules]]
id = "RUST-ORG-002"
text = "Use the convention `name/mod.rs` for modules with submodules."

[[rules]]
id = "RUST-ORG-003"
text = "Keep `lib.rs` mostly to module declarations and intentional public API re-exports. Do not put implementation logic in `lib.rs`."

[[rules]]
id = "RUST-ORG-004"
text = "Use `src/error.rs` for the crate error type, re-exported as `crate::Error`."

[[rules]]
id = "RUST-ORG-005"
text = "Default to the smallest useful visibility. Prefer private items, then `pub(super)`, then `pub(crate)`, and only use `pub` for intentional crate API. Public fields should be rare."
references = ["https://effective-rust.com/visibility.html"]

[[rules]]
id = "RUST-ORG-006"
text = "Put the main struct or enum of a module first, with supporting elements next in order of importance."

[[rules]]
id = "RUST-ORG-007"
text = "Order each module by idea, not by item kind. Put the main type first, followed immediately by its inherent `impl`, then its trait impls. Then introduce the next most important supporting type with its impls and trait impls. Keep tests at the end of the module."

[[rules]]
id = "RUST-ORG-008"
text = "Put `impl` blocks for the main type first, then trait implementations roughly in order of importance, grouped by struct."

[[rules]]
id = "RUST-ORG-009"
text = "Keep functions as small readable units. Readability owns the decision more than line count."

[[rules]]
id = "RUST-DOC-001"
text = "Document public APIs with concise contracts for this repository's maintainers."

[[rules]]
id = "RUST-DOC-002"
text = "Follow the comment rules for comment prose and Rustdoc tone."

[[rules]]
id = "RUST-DOC-003"
text = "Keep Rustdoc concise. Add sections like `# Errors` only when there is a real contract to explain."

[[rules]]
id = "RUST-CODE-001"
text = "Do what Clippy says. It leads to idiomatic Rust code."

[[rules]]
id = "RUST-CODE-002"
text = "Panic, `unwrap`, and `expect` usage is owned by Clippy. Prefer `Result`, typed errors, and `claims` assertions in tests."

[[rules]]
id = "RUST-CODE-003"
text = "Suppress Clippy with `#[expect(clippy::lint_name, reason = \"...\")]`, not `#[allow(...)]` or command-line `-A`. The reason must explain the local invariant or tool contract that makes the lint inapplicable. If suppressing `panic`, `unwrap`, or `expect` lints, the reason must explain why unexpectedly crashing the program is acceptable when the invariant is wrong."

[[rules]]
id = "RUST-CODE-004"
text = "Use the Newtype pattern for values with domain meaning that raw primitives cannot express."
references = ["https://effective-rust.com/newtype.html"]

[[rules]]
id = "RUST-CODE-005"
text = "Represent data in memory as the strongest domain type available as soon as possible."

[[rules]]
id = "RUST-CODE-006"
text = "Convert raw or external representations from HTTP, storage, config, CLI, JSON, or third-party APIs into domain types immediately."

[[rules]]
id = "RUST-CODE-007"
text = "Use `From<T>` only for infallible conversions. Use constructors, `TryFrom<T>`, or `FromStr` for fallible conversions."

[[rules]]
id = "RUST-CODE-023"
text = "Do not implement `From`/`Into` for a derivation that needs external context such as a clock or joined rows, or that can disagree with an authoritative source like SQL. `From`/`Into` advertises a total, context-free 1:1 mapping. Reserve them for pure shape conversions; express context-dependent or fallible derivations as a named function that takes its inputs explicitly."

[[rules]]
id = "RUST-CODE-008"
text = "Deserialize external or wire formats into raw DTOs only long enough to convert them into domain types. Do not let loosely typed serde structs leak through core code."

[[rules]]
id = "RUST-CODE-022"
text = "Keep invariant-bearing domain types in memory. Raw or invariant-free values may exist at boundaries such as databases, HTTP, JSON, CLI, config, and third-party APIs, but convert them before core logic and handle validation errors at the boundary."

[[rules]]
id = "RUST-PRIV-001"
text = "Privacy is paramount. Types that hold secrets, credentials, tokens, private relationship content, or user-authored text must not expose the raw value through Debug, Display, logs, panic messages, assertion messages, or error strings. Use redacted or summary output that preserves diagnostic shape without leaking private content."

[[rules]]
id = "RUST-PRIV-002"
text = "Do not derive Debug for privacy-bearing types unless every field's Debug implementation is already safe. Prefer manual Debug implementations that name the state and summarize private fields by kind, length, status, or redacted marker."

[[rules]]
id = "RUST-CODE-009"
text = "Prefer exhaustive enum matching."

[[rules]]
id = "RUST-CODE-010"
text = "Use `rapport_temporal` for all date and time calculations. Do not use `chrono` directly except in boundary adapters that immediately convert into `rapport_temporal` types and document the compatibility need."

[[rules]]
id = "RUST-CODE-011"
text = "Implement `Display` with `derive_more`, ensuring private information is not leaked."

[[rules]]
id = "RUST-CODE-012"
text = "Use `thiserror` for errors. Preserve error chains with `#[source]`, `#[from]`, or transparent variants where appropriate. Do not stringify errors until presentation or logging."

[[rules]]
id = "RUST-CODE-013"
text = "Name lifetime parameters after what they borrow, such as `'runner`, not generic names like `'a`."

[[rules]]
id = "RUST-CODE-014"
text = "Use builders for complex construction."

[[rules]]
id = "RUST-CODE-015"
text = "Implement `Default` only when the default value is meaningful in the domain, not merely convenient for tests or setup."
references = ["https://effective-rust.com/builders.html"]

[[rules]]
id = "RUST-CODE-016"
text = "Public traits should have the smallest required method set. Add convenience methods as default implementations when they can be built from the required methods. Choose generics, `impl Trait`, or `dyn Trait` deliberately based on whether callers need static dispatch, type erasure, or heterogeneous values."
references = [
  "https://effective-rust.com/default-impl.html",
  "https://effective-rust.com/generics.html",
]

[[rules]]
id = "RUST-CODE-017"
text = "For money, quotas, limits, counters, and other domain arithmetic, make overflow, rounding, and clamping behavior explicit in the domain type or conversion contract. When an extreme value has a sensible boundary, use saturating or clamping behavior instead of returning errors for ordinary arithmetic extremes. Reserve errors for invalid inputs or impossible states."

[[rules]]
id = "RUST-CODE-018"
text = "Crate features must be additive. Do not make public fields, trait methods, or expected behavior disappear under feature combinations. If a feature changes the public API surface, document and test the intended combinations."
references = ["https://effective-rust.com/features.html"]

[[rules]]
id = "RUST-CODE-019"
text = "Do not add first-party `unsafe` code. If existing `unsafe` is encountered, stop and ask before editing it."

[[rules]]
id = "RUST-CODE-020"
text = "Treat `rapport_*` crates as first-party shared libraries. Their public types may appear in public APIs when they are the strongest domain type. Do not wrap or re-export them only to satisfy the third-party type rule."

[[rules]]
id = "RUST-CODE-021"
text = "If a third-party type appears in a public API, either re-export it intentionally or wrap it in a newtype. Do not leak dependency types accidentally. Re-export when callers should name that exact type; use a newtype when the dependency is an implementation detail or the domain deserves its own meaning."

[[rules]]
id = "RUST-NAME-001"
text = "Avoid abbreviations when naming things. Prefer `connection_processor` over `cp`."

[[rules]]
id = "RUST-TEST-001"
text = "Follow the testing rules for Rust tests: claims macros, rstest, hand-rolled fakes, FakeClock injection, and `expecting` assert messages."

[[rules]]
id = "RUST-LOG-001"
text = "Logs should tell the story of the user journey, starting with a lowercase sentence usually in gerund form, such as `tracing::debug!(\"fetching user\")`."

[[rules]]
id = "RUST-LOG-002"
text = "Use structured `tracing` fields for searchable context."

[[rules]]
id = "RUST-LOG-003"
text = "Never log secrets, tokens, encryption material, or private relationship content."

[[rules]]
id = "RUST-LOG-004"
text = "Prefer debug logs to comments for reading code."
