name: "Rapport signoff: root-review"

# Rapport owns this file byte-for-byte. Run `rapport context signoff repair . review` to restore it.

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/rapport-root-review.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/rapport-signoff.yml
    with:
      target: root-review
    secrets: inherit
