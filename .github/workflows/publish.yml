name: Publish

# Triggered manually after a version bump is committed and merged to main.
# Each invocation publishes one crate. Pick the crate from the dropdown.
# Version is read from that crate's Cargo.toml — bump it before triggering.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Which crate to publish"
        type: choice
        required: true
        options:
          - rapport
          - rapport-cli
          - rapport-prose
          - rapport-temporal

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run CI before publish
        run: just ci

      - name: Publish to crates.io
        run: cargo publish -p ${{ github.event.inputs.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
