name: "Rapport Root Signoff ci"

# Rapport owns this file byte-for-byte.

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/rapport-root-signoff-ci.yml"

permissions:
  contents: read

jobs:
  signoff:
    name: "Rapport Root Signoff ci"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
      - name: Run ci
        working-directory: "."
        run: just ci
